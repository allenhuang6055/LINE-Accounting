name: Production manual deletion baseline
on:
  push:
    branches:
      - fix/main-minimal-manual-delete-20261106
  workflow_dispatch:
jobs:
  baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check server.js
      - run: node --test test/current-manual-delete-limitations.test.js test/manual-delete-metadata.test.js
